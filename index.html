<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Game Back-Logger</title>
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-row title-row">
        <h1>🎮 Game Back-Logger</h1>
        <div class="menu-wrap">
          <button id="menu-btn" class="icon-btn" aria-label="Menu" aria-expanded="false">⋮</button>
          <div id="menu" class="menu" hidden>
            <button id="import-btn" type="button">Import…</button>
            <button id="export-btn" type="button">Export…</button>
          </div>
        </div>
      </div>
      <div class="header-row search-row">
        <input id="search" type="search" placeholder="Search titles…" autocomplete="off" />
        <button id="add-btn" class="primary" type="button">+ Add</button>
      </div>
      <div id="chips" class="chips" role="group" aria-label="Filter by status"></div>
    </header>

    <main id="sections" aria-live="polite"></main>

    <dialog id="game-dialog">
      <form id="game-form" novalidate>
        <h2 id="dialog-title">Add game</h2>
        <label class="field">
          <span>Title</span>
          <input name="title" type="text" required autocomplete="off" />
        </label>
        <label class="field">
          <span>Status</span>
          <select name="status"></select>
        </label>
        <label class="field" id="rating-field">
          <span>Rating</span>
          <select name="rating">
            <option value="">No rating</option>
            <option value="5">★★★★★</option>
            <option value="4">★★★★</option>
            <option value="3">★★★</option>
            <option value="2">★★</option>
            <option value="1">★</option>
          </select>
        </label>
        <div class="field-pair" id="dates-fields">
          <label class="field">
            <span>Started</span>
            <input name="startedDate" type="date" />
          </label>
          <label class="field">
            <span>Finished</span>
            <input name="finishedDate" type="date" />
          </label>
        </div>
        <label class="field">
          <span>Notes</span>
          <textarea name="notes" rows="3"></textarea>
        </label>
        <div class="dialog-actions">
          <button type="button" id="delete-btn" class="danger" hidden>Delete</button>
          <span class="spacer"></span>
          <button type="button" id="cancel-btn">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="import-dialog">
      <h2>Import backup</h2>
      <p id="import-summary"></p>
      <div class="dialog-actions column">
        <button type="button" id="import-merge-btn" class="primary">Merge into current list</button>
        <button type="button" id="import-replace-btn" class="danger">Replace current list</button>
        <button type="button" id="import-cancel-btn">Cancel</button>
      </div>
    </dialog>

    <input id="import-file" type="file" accept=".json,application/json" hidden />

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
